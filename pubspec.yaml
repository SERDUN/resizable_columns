name: resizable_columns
description: "A Flutter widget that lays out panes in a row or a column with draggable dividers. Supports nesting, minimum sizes, pushing neighbouring panes and right-to-left layouts."
version: 0.1.0
homepage: https://github.com/SERDUN/resizable_columns
repository: https://github.com/SERDUN/resizable_columns
issue_tracker: https://github.com/SERDUN/resizable_columns/issues

environment:
  sdk: ^3.5.3
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
